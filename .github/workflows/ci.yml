name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [stage, main]
  push:
    branches: [stage, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Type check and build
        run: npm run build

  container:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'http://localhost:3000' }}
            APP_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the container serves the app and assets
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          docker run -d --name smoke -p 127.0.0.1:3000:3000 "$IMAGE"
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 2 --retry-max-time 60 --max-time 10 http://127.0.0.1:3000/ -o /tmp/home.html
          grep -q 'Expense Calendar' /tmp/home.html
          asset=$(grep -oE '/_next/static/[^" ]+\.css' /tmp/home.html | head -1)
          test -n "$asset"
          curl --fail --silent --show-error --max-time 10 "http://127.0.0.1:3000$asset" -o /dev/null

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - name: Request optional Coolify deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.COOLIFY_AUTO_DEPLOY == 'true'
        env:
          DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          test -n "$DEPLOY_URL" && test -n "$API_TOKEN"
          curl --fail --silent --show-error --proto '=https' --max-time 60 \
            --header "Authorization: Bearer $API_TOKEN" \
            --output /dev/null "$DEPLOY_URL"
